[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tes-destripe"
version = "0.1.0"
description = "Remove orbit-track striping from MGS TES global maps (PDS3 QUBE in, GeoTIFF out)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adomas Valantinas" }]
keywords = ["Mars", "TES", "Mars Global Surveyor", "destriping", "Fourier filter", "PDS3", "GeoTIFF"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "rasterio>=1.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/euchas/tes-destripe"
Repository = "https://github.com/euchas/tes-destripe"
Issues = "https://github.com/euchas/tes-destripe/issues"

[project.scripts]
tes-destripe = "tes_destripe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
